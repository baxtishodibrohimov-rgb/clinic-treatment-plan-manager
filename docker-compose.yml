services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tp_user
      POSTGRES_PASSWORD: tp_password
      POSTGRES_DB: tp_manager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tp_user -d tp_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tp_user:tp_password@postgres:5432/tp_manager
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  celery-worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tp_user:tp_password@postgres:5432/tp_manager
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
    command: celery -A app.jobs.celery_app worker --loglevel=info

  celery-beat:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tp_user:tp_password@postgres:5432/tp_manager
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
    command: celery -A app.jobs.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
